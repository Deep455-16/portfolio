<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Mundra — Software & AI Engineer</title>
<meta name="description" content="Deep Mundra — Computer Science student building offline AI systems, RAG pipelines, and full-stack applications.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#0F1113;
  --bg-raised:#15181B;
  --line:#2A2E33;
  --ink:#ECE9E3;
  --ink-dim:#9A968E;
  --ink-faint:#5F5C57;
  --accent:#C98A3C;
  --accent-dim:#8C6530;
  --accent-tint:#2A2115;
  --radius:3px;
  --mono:'IBM Plex Mono', monospace;
  --display:'Space Grotesk', sans-serif;
  --body:'Inter', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--accent); color:#12100A;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

.wrap{display:flex; min-height:100vh;}

/* ---------- SIDEBAR ---------- */
.rail{
  width:230px; flex:none;
  border-right:1px solid var(--line);
  padding:32px 22px;
  position:fixed; top:0; left:0; bottom:0;
  display:flex; flex-direction:column;
  justify-content:space-between;
  z-index:50;
  background:var(--bg);
}
.rail-top .mark{
  font-family:var(--display); font-weight:600; font-size:1.05rem; letter-spacing:-0.01em;
  display:block; margin-bottom:3px;
}
.rail-top .mark span{color:var(--accent);}
.rail-top .role{font-family:var(--mono); font-size:0.72rem; color:var(--ink-faint);}
.rail-nav{margin-top:44px; display:flex; flex-direction:column; gap:2px;}
.rail-nav button{
  background:none; border:none; text-align:left; color:var(--ink-dim);
  font-size:0.86rem; padding:9px 10px; border-radius:var(--radius);
  display:flex; align-items:center; gap:10px; transition:color .15s, background .15s;
  font-family:var(--body); font-weight:500;
}
.rail-nav button .dot{width:5px;height:5px;border-radius:50%;background:var(--ink-faint); flex:none; transition:background .15s;}
.rail-nav button:hover{color:var(--ink);}
.rail-nav button.active{color:var(--ink); background:var(--bg-raised);}
.rail-nav button.active .dot{background:var(--accent);}
.rail-bottom{display:flex; flex-direction:column; gap:10px;}
.rail-bottom a{
  font-size:0.78rem; color:var(--ink-dim); display:flex; align-items:center; gap:8px;
}
.rail-bottom a:hover{color:var(--accent);}
.rail-bottom .status{font-family:var(--mono); font-size:0.68rem; color:var(--ink-faint); display:flex; align-items:center; gap:6px; margin-top:4px;}
.rail-bottom .blip{width:6px;height:6px;border-radius:50%; background:#6E9B6B; box-shadow:0 0 0 3px rgba(110,155,107,.15);}

/* mobile top bar */
.topbar{display:none;}
.mobile-menu{display:none;}

.main{margin-left:230px; width:100%; max-width:1000px;}
.page{display:none; padding:64px 64px 100px;}
.page.active{display:block; animation:fadein .35s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.eyebrow{font-family:var(--mono); font-size:0.72rem; color:var(--accent); margin-bottom:14px; display:block;}
h1,h2,h3{font-family:var(--display); font-weight:600; letter-spacing:-0.015em; color:var(--ink);}
.section-head{max-width:640px; margin-bottom:44px;}
.section-head h2{font-size:1.9rem; margin-bottom:10px;}
.section-head p{color:var(--ink-dim); font-size:0.98rem; max-width:560px;}

/* ---------- HOME ---------- */
.hero{display:grid; grid-template-columns:1.1fr 0.9fr; gap:50px; align-items:center; min-height:70vh;}
.hero-left .avail{
  display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:0.72rem;
  color:var(--ink-dim); border:1px solid var(--line); padding:5px 11px; border-radius:20px; margin-bottom:26px;
}
.avail .blip{width:6px;height:6px;border-radius:50%;background:#6E9B6B;}
.hero-left h1{font-size:3.1rem; line-height:1.08; margin-bottom:18px;}
.hero-left h1 em{font-style:normal; color:var(--accent);}
.hero-left .lede{color:var(--ink-dim); font-size:1.05rem; max-width:480px; margin-bottom:32px;}
.btn-row{display:flex; gap:14px; flex-wrap:wrap;}
.btn{
  font-size:0.88rem; font-weight:500; padding:12px 20px; border-radius:var(--radius);
  display:inline-flex; align-items:center; gap:8px; transition:all .15s;
  border:1px solid transparent;
}
.btn-primary{background:var(--accent); color:#161207;}
.btn-primary:hover{background:#dd9a48;}
.btn-ghost{border-color:var(--ink-dim); color:var(--ink); background:transparent;}
.btn-ghost:hover{border-color:var(--accent); color:var(--accent); background:var(--bg-raised);}

/* terminal */
.term{
  background:var(--bg-raised); border:1px solid var(--line); border-radius:6px;
  font-family:var(--mono); font-size:0.82rem; overflow:hidden;
}
.term-head{display:flex; align-items:center; gap:7px; padding:11px 14px; border-bottom:1px solid var(--line);}
.term-head span{width:9px;height:9px;border-radius:50%; background:var(--line);}
.term-head .label{margin-left:auto; color:var(--ink-faint); font-size:0.7rem;}
.term-body{padding:16px 16px 8px; height:150px; overflow-y:auto; color:var(--ink-dim);}
.term-body .line{margin-bottom:9px; white-space:pre-wrap; word-break:break-word;}
.term-body .prompt-sym{color:var(--accent); margin-right:8px;}
.term-body .out-title{color:var(--ink); font-weight:500;}
.term-input-row{display:flex; align-items:center; padding:10px 16px; border-top:1px solid var(--line); gap:8px;}
.term-input-row .prompt-sym{color:var(--accent);}
.term-input-row input{
  flex:1; background:none; border:none; color:var(--ink); font-family:var(--mono); font-size:0.82rem;
}
.term-input-row input:focus{outline:none;}
.term-hint{color:var(--ink-faint); font-size:0.68rem; padding:0 16px 12px;}

/* stats strip */
.stats{display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin-top:64px;}
.stat{padding:26px 22px; border-right:1px solid var(--line);}
.stat:last-child{border-right:none;}
.stat .num{font-family:var(--display); font-size:1.9rem; color:var(--ink); font-weight:600;}
.stat .lbl{font-family:var(--mono); font-size:0.7rem; color:var(--ink-faint); margin-top:4px;}

/* ---------- ABOUT ---------- */
.focus-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:36px;}
.focus-card{border:1px solid var(--line); border-radius:var(--radius); padding:20px; background:var(--bg-raised);}
.focus-card h3{font-size:0.98rem; margin-bottom:6px; font-family:var(--body); font-weight:600;}
.focus-card p{font-size:0.85rem; color:var(--ink-dim);}

.edu-item{border-left:2px solid var(--line); padding:4px 0 26px 22px; position:relative;}
.edu-item::before{content:''; position:absolute; left:-5px; top:6px; width:8px;height:8px;border-radius:50%;background:var(--accent);}
.edu-item .dur{font-family:var(--mono); font-size:0.7rem; color:var(--ink-faint); margin-bottom:6px;}
.edu-item h3{font-size:1.05rem; margin-bottom:3px;}
.edu-item .school{color:var(--ink-dim); font-size:0.88rem; margin-bottom:8px;}
.edu-item .meta{font-size:0.83rem; color:var(--ink-dim);}
.edu-item .cgpa{color:var(--accent); font-family:var(--mono);}

/* ---------- EXPERIENCE ---------- */
.timeline{border-left:2px solid var(--line); margin-left:4px;}
.tl-item{position:relative; padding:0 0 42px 32px;}
.tl-item::before{content:''; position:absolute; left:-7px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--bg); border:2px solid var(--accent);}
.tl-item .dur{font-family:var(--mono); font-size:0.7rem; color:var(--accent); margin-bottom:8px;}
.tl-item h3{font-size:1.15rem; margin-bottom:2px;}
.tl-item .org{color:var(--ink-dim); font-size:0.9rem; margin-bottom:14px;}
.tl-item ul{padding-left:18px; display:flex; flex-direction:column; gap:10px;}
.tl-item li{font-size:0.9rem; color:var(--ink-dim);}
.tl-item li::marker{color:var(--accent);}
.tl-item li a{color:var(--accent); border-bottom:1px solid var(--accent-dim);}
.tag-row{display:flex; flex-wrap:wrap; gap:7px; margin-top:14px;}
.tag{font-family:var(--mono); font-size:0.7rem; color:var(--ink-dim); border:1px solid var(--line); padding:4px 9px; border-radius:20px;}

/* ---------- PROJECTS ---------- */
.filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:32px;}
.filter-row button{
  font-size:0.8rem; color:var(--ink-dim); background:none; border:1px solid var(--line);
  padding:7px 14px; border-radius:20px; font-family:var(--mono);
}
.filter-row button.active{color:#161207; background:var(--accent); border-color:var(--accent);}
.proj-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px;}
.proj-card{
  border:1px solid var(--line); border-radius:6px; padding:26px; background:var(--bg-raised);
  cursor:pointer; transition:border-color .15s, transform .15s; position:relative; overflow:hidden;
}
.proj-card:hover{border-color:var(--accent-dim); transform:translateY(-2px);}
.proj-card .cat{font-family:var(--mono); font-size:0.68rem; color:var(--accent); margin-bottom:12px; display:block;}
.proj-card h3{font-size:1.15rem; margin-bottom:10px;}
.proj-card p{font-size:0.86rem; color:var(--ink-dim); margin-bottom:18px; min-height:60px;}
.proj-card .stack{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px;}
.proj-card .stack span{font-size:0.68rem; font-family:var(--mono); color:var(--ink-faint); border:1px solid var(--line); padding:3px 8px; border-radius:20px;}
.proj-card .foot{display:flex; align-items:center; justify-content:space-between; font-size:0.82rem;}
.proj-card .foot .view{color:var(--ink); display:flex; align-items:center; gap:6px;}
.proj-card .foot .arrow{transition:transform .15s;}
.proj-card:hover .foot .arrow{transform:translateX(4px);}

/* project detail */
.pd-back{font-family:var(--mono); font-size:0.78rem; color:var(--ink-dim); display:inline-flex; align-items:center; gap:6px; margin-bottom:30px; background:none; border:none;}
.pd-back:hover{color:var(--accent);}
.pd-head h1{font-size:2.1rem; margin-bottom:10px;}
.pd-head .desc{color:var(--ink-dim); font-size:1rem; max-width:600px; margin-bottom:20px;}
.pd-badges{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:26px;}
.pd-badges span{font-family:var(--mono); font-size:0.72rem; color:var(--ink-dim); border:1px solid var(--line); padding:5px 11px; border-radius:20px;}
.pd-links{display:flex; gap:12px; margin-bottom:48px;}
.pd-block{margin-bottom:40px; max-width:680px;}
.pd-block h2{font-size:1.05rem; margin-bottom:12px; font-family:var(--body); font-weight:600; color:var(--ink);}
.pd-block p{color:var(--ink-dim); font-size:0.92rem;}
.feature-list{display:flex; flex-direction:column; gap:12px;}
.feature-list .f{border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; font-size:0.88rem; color:var(--ink-dim); background:var(--bg-raised);}
.stack-cats{display:grid; grid-template-columns:repeat(2,1fr); gap:16px;}
.stack-cat h4{font-family:var(--mono); font-size:0.7rem; color:var(--accent); margin-bottom:8px;}
.stack-cat .items{display:flex; flex-wrap:wrap; gap:6px;}
.stack-cat .items span{font-size:0.78rem; color:var(--ink); border:1px solid var(--line); padding:4px 9px; border-radius:var(--radius);}

/* ---------- SKILLS ---------- */
.skill-groups{display:flex; flex-direction:column; gap:36px;}
.skill-group h3{font-family:var(--mono); font-size:0.75rem; color:var(--accent); margin-bottom:14px;}
.skill-chips{display:flex; flex-wrap:wrap; gap:9px;}
.skill-chips span{
  font-size:0.85rem; color:var(--ink); border:1px solid var(--line); padding:8px 14px; border-radius:var(--radius);
  background:var(--bg-raised); transition:border-color .15s, color .15s;
}
.skill-chips span:hover{border-color:var(--accent); color:var(--accent);}

/* ---------- ACHIEVEMENTS ---------- */
.ach-list{display:flex; flex-direction:column;}
.ach-row{display:grid; grid-template-columns:150px 1fr; gap:24px; padding:20px 0; border-top:1px solid var(--line);}
.ach-row:last-child{border-bottom:1px solid var(--line);}
.ach-row .tag2{font-family:var(--mono); font-size:0.7rem; color:var(--accent);}
.ach-row h3{font-size:1rem; margin-bottom:5px; font-family:var(--body); font-weight:600;}
.ach-row p{font-size:0.85rem; color:var(--ink-dim);}

.cert-list{display:flex; flex-direction:column; gap:12px;}
.cert-card{border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; display:flex; justify-content:space-between; align-items:center; background:var(--bg-raised);}
.cert-card h3{font-size:0.95rem; font-weight:600; margin-bottom:4px;}
.cert-card p{font-size:0.82rem; color:var(--ink-dim);}
.cert-card a{font-family:var(--mono); font-size:0.75rem; color:var(--accent); border:1px solid var(--accent-dim); padding:6px 12px; border-radius:20px;}

/* ---------- CONTACT ---------- */
.contact-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:10px;}
.contact-card{border:1px solid var(--line); border-radius:6px; padding:24px; background:var(--bg-raised); display:flex; flex-direction:column; gap:10px;}
.contact-card .k{font-family:var(--mono); font-size:0.7rem; color:var(--accent);}
.contact-card .v{font-size:1rem;}
.contact-cta{margin-top:48px; padding:36px; border:1px solid var(--line); border-radius:6px; background:var(--bg-raised); text-align:left;}
.contact-cta h2{font-size:1.5rem; margin-bottom:14px;}

/* resume */
.resume-actions{display:flex; gap:14px; margin-bottom:30px;}
.resume-frame{border:1px solid var(--line); border-radius:6px; overflow:hidden; height:70vh; background:var(--bg-raised); display:flex; align-items:center; justify-content:center; color:var(--ink-faint); font-family:var(--mono); font-size:0.85rem; text-align:center; padding:20px;}

footer.site-footer{border-top:1px solid var(--line); padding:40px 64px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; color:var(--ink-faint); font-size:0.8rem;}
footer.site-footer .flinks{display:flex; gap:18px;}
footer.site-footer a:hover{color:var(--accent);}

/* ---------- 3D CANVASES ---------- */
.hero{position:relative;}
.hero-canvas-wrap{
  position:relative; height:420px; border-radius:8px; overflow:hidden;
  border:1px solid var(--line); background:radial-gradient(circle at 60% 40%, #171a1e 0%, #0F1113 70%);
}
.hero-canvas-wrap canvas{display:block; width:100%; height:100%;}
.hero-canvas-wrap .tag-corner{
  position:absolute; top:12px; left:14px; font-family:var(--mono); font-size:0.66rem; color:var(--ink-faint);
  letter-spacing:0.02em; pointer-events:none;
}
.hero-bg-field{
  position:absolute; inset:0; z-index:-1; opacity:0.5; pointer-events:none;
}
.hero-bg-field canvas{width:100%; height:100%; display:block;}

.orbit-wrap{
  position:relative; height:460px; border-radius:8px; overflow:hidden; margin-top:20px;
  border:1px solid var(--line); background:radial-gradient(circle at 50% 50%, #171a1e 0%, #0F1113 75%);
  cursor:grab;
}
.orbit-wrap:active{cursor:grabbing;}
.orbit-wrap canvas{display:block; width:100%; height:100%;}
.orbit-label{
  position:absolute; font-family:var(--mono); font-size:0.72rem; color:var(--ink); pointer-events:none;
  background:rgba(21,24,27,0.85); border:1px solid var(--line); padding:3px 8px; border-radius:20px;
  transform:translate(-50%,-50%); white-space:nowrap; transition:opacity .15s;
}
.orbit-hint{font-family:var(--mono); font-size:0.68rem; color:var(--ink-faint); margin-top:10px;}

/* 3D tilt project cards */
.proj-card{transform-style:preserve-3d; will-change:transform;}
.proj-card .tilt-glow{
  position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .2s;
  background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%), rgba(201,138,60,0.14), transparent 60%);
}
.proj-card:hover .tilt-glow{opacity:1;}

/* mobile menu button */
.menu-btn{display:none;}

@media(max-width:980px){
  .rail{display:none;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:60;
  }
  .topbar .mark{font-family:var(--display); font-weight:600; font-size:1rem;}
  .topbar .mark span{color:var(--accent);}
  .menu-btn{display:flex; flex-direction:column; gap:4px; background:none; border:none; padding:6px;}
  .menu-btn i{width:20px;height:2px;background:var(--ink);}
  .mobile-menu{
    display:none; position:fixed; top:57px; left:0; right:0; bottom:0; background:var(--bg); z-index:59;
    padding:20px; flex-direction:column; gap:4px; overflow-y:auto;
  }
  .mobile-menu.open{display:flex;}
  .mobile-menu button{
    background:none; border:none; text-align:left; color:var(--ink-dim); font-size:1rem; padding:14px 8px;
    border-bottom:1px solid var(--line); font-family:var(--body);
  }
  .mobile-menu button.active{color:var(--accent);}
  .main{margin-left:0; max-width:100%;}
  .page{padding:36px 22px 70px;}
  .hero{grid-template-columns:1fr; min-height:auto;}
  .hero-left h1{font-size:2.2rem;}
  .stats{grid-template-columns:repeat(2,1fr);}
  .stat:nth-child(2){border-right:none;}
  .focus-grid, .stack-cats, .contact-grid, .proj-grid{grid-template-columns:1fr;}
  .ach-row{grid-template-columns:1fr; gap:6px;}
  footer.site-footer{padding:30px 22px; flex-direction:column; align-items:flex-start;}
}
</style>
</head>

/* ============ TILT (CSS 3D, lightweight — used everywhere incl. mobile) ============ */
function bindTilt(card){
  const max = 6; // degrees, restrained
  card.addEventListener("mousemove", (e)=>{
    const r = card.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width;
    const py = (e.clientY - r.top) / r.height;
    const rx = (0.5 - py) * max;
    const ry = (px - 0.5) * max;
    card.style.transform = `perspective(700px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-2px)`;
    card.style.setProperty("--mx", (px*100)+"%");
    card.style.setProperty("--my", (py*100)+"%");
  });
  card.addEventListener("mouseleave", ()=>{
    card.style.transform = "";
  });
}

/* ============ THREE.JS SCENES ============ */
const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const LOW_POWER = window.innerWidth < 760;
let scenes = { hero:null, bg:null, orbit:null };

function teardown3D(){
  Object.keys(scenes).forEach(k=>{
    const s = scenes[k];
    if(s && s.raf) cancelAnimationFrame(s.raf);
    if(s && s.renderer) s.renderer.dispose();
    scenes[k] = null;
  });
}

function initHero3D(){
  const wrap = document.getElementById("heroCanvasWrap");
  if(!wrap || typeof THREE === "undefined") return;
  const w = wrap.clientWidth, h = wrap.clientHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, w/h, 0.1, 100);
  camera.position.set(0, 0, 9);
  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, LOW_POWER ? 1 : 1.6));
  wrap.appendChild(renderer.domElement);

  // Central AI core: layered wireframe icosahedrons
  const core = new THREE.Group();
  const geo1 = new THREE.IcosahedronGeometry(1.7, 1);
  const mat1 = new THREE.MeshBasicMaterial({ color:0xC98A3C, wireframe:true, transparent:true, opacity:0.55 });
  const mesh1 = new THREE.Mesh(geo1, mat1);
  core.add(mesh1);
  const geo2 = new THREE.IcosahedronGeometry(2.3, 0);
  const mat2 = new THREE.MeshBasicMaterial({ color:0x6E6A62, wireframe:true, transparent:true, opacity:0.25 });
  const mesh2 = new THREE.Mesh(geo2, mat2);
  core.add(mesh2);
  scene.add(core);

  // Neural node network (particles + connecting lines) surrounding the core
  const NODE_COUNT = LOW_POWER ? 26 : 46;
  const nodePositions = [];
  for(let i=0;i<NODE_COUNT;i++){
    const r = 3.4 + Math.random()*2.4;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos((Math.random()*2)-1);
    nodePositions.push(new THREE.Vector3(
      r*Math.sin(phi)*Math.cos(theta),
      r*Math.sin(phi)*Math.sin(theta),
      r*Math.cos(phi)
    ));
  }
  const nodeGeo = new THREE.BufferGeometry().setFromPoints(nodePositions);
  const nodeMat = new THREE.PointsMaterial({ color:0xECE9E3, size:0.06, transparent:true, opacity:0.8 });
  const points = new THREE.Points(nodeGeo, nodeMat);
  scene.add(points);

  // connecting lines between nearby nodes
  const lineVerts = [];
  for(let i=0;i<nodePositions.length;i++){
    for(let j=i+1;j<nodePositions.length;j++){
      if(nodePositions[i].distanceTo(nodePositions[j]) < 2.1){
        lineVerts.push(nodePositions[i], nodePositions[j]);
      }
    }
  }
  const lineGeo = new THREE.BufferGeometry().setFromPoints(lineVerts);
  const lineMat = new THREE.LineBasicMaterial({ color:0x8C6530, transparent:true, opacity:0.22 });
  const lines = new THREE.LineSegments(lineGeo, lineMat);
  scene.add(lines);

  let mx = 0, my = 0;
  const onMove = (e)=>{
    const r = wrap.getBoundingClientRect();
    mx = ((e.clientX - r.left)/r.width - 0.5) * 2;
    my = ((e.clientY - r.top)/r.height - 0.5) * 2;
  };
  wrap.addEventListener("mousemove", onMove);

  const s = { renderer, raf:null };
  scenes.hero = s;

  function animate(){
    s.raf = requestAnimationFrame(animate);
    if(!REDUCED_MOTION){
      core.rotation.y += 0.0028;
      core.rotation.x += 0.0009;
      points.rotation.y += 0.0009;
      lines.rotation.y += 0.0009;
      camera.position.x += (mx*1.1 - camera.position.x) * 0.04;
      camera.position.y += (-my*0.8 - camera.position.y) * 0.04;
      camera.lookAt(0,0,0);
    }
    renderer.render(scene, camera);
  }
  animate();
}

function initOrbit3D(){
  const wrap = document.getElementById("orbitWrap");
  if(!wrap || typeof THREE === "undefined") return;
  const w = wrap.clientWidth, h = wrap.clientHeight;

  // pick representative technologies actually present in resume skills
  const nodeList = [
    {label:"Python", cat:"Language"}, {label:"React.js", cat:"Framework"},
    {label:"TensorFlow", cat:"ML/AI"}, {label:"PyTorch", cat:"ML/AI"},
    {label:"LangChain", cat:"Gen AI"}, {label:"Docker", cat:"DevOps"},
    {label:"MongoDB", cat:"Database"}, {label:"Flask", cat:"Framework"},
    {label:"OpenCV", cat:"ML/AI"}, {label:"RAG", cat:"Gen AI"},
    {label:"Node.js", cat:"Framework"}, {label:"MySQL", cat:"Database"},
  ];

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, w/h, 0.1, 100);
  camera.position.set(0,0,10);
  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setSize(w,h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, LOW_POWER ? 1 : 1.6));
  wrap.appendChild(renderer.domElement);

  const group = new THREE.Group();
  scene.add(group);

  const coreGeo = new THREE.SphereGeometry(0.9, 24, 24);
  const coreMat = new THREE.MeshBasicMaterial({ color:0xC98A3C, wireframe:true, transparent:true, opacity:0.6 });
  group.add(new THREE.Mesh(coreGeo, coreMat));

  const nodeMeshes = [];
  const radius = 3.6;
  nodeList.forEach((n, i)=>{
    const phi = Math.acos(1 - 2*(i+0.5)/nodeList.length);
    const theta = Math.PI * (1 + Math.sqrt(5)) * i;
    const pos = new THREE.Vector3(
      radius*Math.sin(phi)*Math.cos(theta),
      radius*Math.sin(phi)*Math.sin(theta),
      radius*Math.cos(phi)
    );
    const g = new THREE.SphereGeometry(0.11, 12, 12);
    const m = new THREE.MeshBasicMaterial({ color:0xECE9E3 });
    const mesh = new THREE.Mesh(g, m);
    mesh.position.copy(pos);
    mesh.userData = n;
    group.add(mesh);
    nodeMeshes.push(mesh);

    const lg = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), pos]);
    const lm = new THREE.LineBasicMaterial({ color:0x8C6530, transparent:true, opacity:0.3 });
    group.add(new THREE.Line(lg, lm));
  });

  // drag to rotate
  let dragging = false, lastX=0, lastY=0, velX=0.002, velY=0.0008;
  wrap.addEventListener("mousedown", (e)=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; });
  window.addEventListener("mouseup", ()=> dragging=false);
  window.addEventListener("mousemove", (e)=>{
    if(!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    group.rotation.y += dx*0.005;
    group.rotation.x += dy*0.005;
    velX = dx*0.0004; velY = dy*0.0004;
    lastX = e.clientX; lastY = e.clientY;
  });
  // touch support
  wrap.addEventListener("touchstart", (e)=>{ dragging=true; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; }, {passive:true});
  window.addEventListener("touchend", ()=> dragging=false);
  window.addEventListener("touchmove", (e)=>{
    if(!dragging) return;
    const dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
    group.rotation.y += dx*0.005;
    group.rotation.x += dy*0.005;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  }, {passive:true});

  // hover label via raycasting
  const raycaster = new THREE.Raycaster();
  const mouseV = new THREE.Vector2();
  let label = document.querySelector(".orbit-label");
  if(!label){
    label = document.createElement("div");
    label.className = "orbit-label";
    label.style.opacity = "0";
    wrap.appendChild(label);
  }
  wrap.addEventListener("mousemove", (e)=>{
    const r = wrap.getBoundingClientRect();
    mouseV.x = ((e.clientX - r.left)/r.width)*2-1;
    mouseV.y = -((e.clientY - r.top)/r.height)*2+1;
    raycaster.setFromCamera(mouseV, camera);
    const hits = raycaster.intersectObjects(nodeMeshes);
    if(hits.length){
      const n = hits[0].object.userData;
      label.textContent = `${n.label} — ${n.cat}`;
      label.style.left = (e.clientX - r.left) + "px";
      label.style.top = (e.clientY - r.top - 22) + "px";
      label.style.opacity = "1";
      hits[0].object.material.color.set(0xC98A3C);
    } else {
      label.style.opacity = "0";
      nodeMeshes.forEach(m=> m.material.color.set(0xECE9E3));
    }
  });

  const s = { renderer, raf:null };
  scenes.orbit = s;

  function animate(){
    s.raf = requestAnimationFrame(animate);
    if(!dragging && !REDUCED_MOTION){
      group.rotation.y += 0.0018;
    }
    renderer.render(scene, camera);
  }
  animate();
}

/* ============ TERMINAL ============ */
function setupTerminal(){
  const input = document.getElementById("termInput");
  const body = document.getElementById("termBody");
  if(!input) return;
  const respond = (cmd)=>{
    const c = cmd.trim().toLowerCase();
    let out = "";
    if(c === "help"){
      out = `<span class="out-title">Available commands</span>\nhelp · about · experience · projects · skills · achievements · contact`;
    } else if(c === "about"){
      out = `CSE student at Manipal University Jaipur (CGPA 8.32). Focused on offline AI systems, RAG pipelines, and full-stack development.`;
    } else if(c === "experience"){
      out = DATA.experience.map(e=>`${e.role} — ${e.org.split(",")[0]} (${e.dur})`).join("\n");
    } else if(c === "projects"){
      out = DATA.projects.map(p=>`${p.name} — ${p.subtitle}`).join("\n");
    } else if(c === "skills"){
      out = Object.keys(DATA.skills).join(" · ");
    } else if(c === "achievements"){
      out = DATA.achievements.slice(0,4).map(a=>a.title).join("\n");
    } else if(c === "contact"){
      out = `${DATA.email} · ${DATA.github}`;
    } else if(c === "clear"){
      body.innerHTML = "";
      return;
    } else if(c === ""){
      return;
    } else {
      out = `command not found: ${c} — type "help"`;
    }
    const line = document.createElement("div");
    line.className = "line";
    line.innerHTML = `<span class="prompt-sym">&gt;</span>${cmd}\n${out}`;
    body.appendChild(line);
    body.scrollTop = body.scrollHeight;

    if(["about","experience","projects","skills","achievements","contact"].includes(c)){
      setTimeout(()=> setRoute(c === "contact" ? "contact" : c), 650);
    }
  };
  input.addEventListener("keydown", (e)=>{
    if(e.key === "Enter" && input.value.trim() !== ""){
      respond(input.value);
      input.value = "";
    }
  });
}

render();
